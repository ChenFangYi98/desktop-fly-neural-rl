<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self';style-src 'self' 'unsafe-inline'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>果蝇开放生态空间</title><style>
:root{color-scheme:dark;font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;--bg:#0b150d;--glass:rgba(7,18,10,.93);--line:rgba(206,238,174,.18);--text:#eef8e9;--muted:#91aa89;--green:#a8da78;--cyan:#65d6ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}canvas{position:fixed;inset:0;display:block}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.toolbar{position:fixed;z-index:8;left:14px;right:14px;top:12px;height:66px;display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:15px;background:var(--glass);box-shadow:0 12px 34px rgba(0,0,0,.28)}.brand{min-width:210px}.brand b{display:block;font-size:15px}.brand small{display:block;margin-top:3px;color:var(--muted);font-size:9px}.group{display:flex;align-items:center;gap:5px;padding-left:8px;border-left:1px solid var(--line)}button,.select{height:34px;padding:0 9px;border:1px solid rgba(211,239,186,.17);border-radius:9px;background:rgba(255,255,255,.055);font-size:9px}.select{background:#112016;outline:none}.select.wide{width:120px}button:hover,button.active{border-color:rgba(168,218,120,.5);background:rgba(168,218,120,.16)}.danger{color:#ffc2b6}.spacer{margin-left:auto}
.view-label{position:fixed;z-index:5;top:91px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(5,13,7,.78);font-size:9px;pointer-events:none}#worldLabel{left:18px}#eyeLabel{left:calc(68% + 16px)}#divider{position:fixed;z-index:4;left:68%;top:88px;bottom:40px;width:1px;background:rgba(220,245,198,.23)}#brainPanel{position:fixed;z-index:4;left:68%;right:0;top:54%;bottom:40px;overflow:hidden;border-top:1px solid rgba(101,214,255,.22);background:radial-gradient(circle,#0e1b28,#05090f 72%)}#brainCanvas{position:absolute;width:100%;height:100%}.brain-head{position:absolute;z-index:2;left:11px;right:11px;top:9px;display:flex;justify-content:space-between;font-size:9px;pointer-events:none}.brain-head b{color:#c9f2ff}.brain-head span{color:#7197a3}#brainRates{position:absolute;z-index:2;left:9px;right:9px;bottom:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;pointer-events:none}#brainRates div{padding:6px;border:1px solid rgba(101,214,255,.12);border-radius:7px;background:rgba(3,8,13,.75);text-align:center}#brainRates span{display:block;color:#668792;font-size:7px}#brainRates b{display:block;margin-top:3px;font-size:10px}
#drawer{position:fixed;z-index:10;left:16px;top:90px;bottom:52px;width:382px;overflow:auto;padding:13px;border:1px solid rgba(168,218,120,.34);border-radius:14px;background:rgba(6,17,9,.97);box-shadow:0 15px 42px rgba(0,0,0,.4);transform:translateX(-410px);transition:.18s}#drawer.show{transform:none}#drawer h2{margin:0 0 3px;font-size:14px}#drawer h3{margin:13px 0 7px;padding-top:10px;border-top:1px solid var(--line);font-size:10px;color:#bad7ac}#drawer p{margin:5px 0;color:#8fa788;font-size:8px;line-height:1.55}#closeDrawer{float:right;height:27px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.field{margin:7px 0}.field label{display:block;margin-bottom:4px;color:#8da687;font-size:8px}.field input,.field select{width:100%;height:31px;padding:0 7px;border:1px solid var(--line);border-radius:7px;background:#0e2013;font-size:9px}.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.palette button{height:auto;min-height:30px;padding:5px 2px;font-size:8px}.palette button.active{background:var(--green);color:#13200e}.info{margin-top:7px;padding:8px;border-radius:8px;background:rgba(101,214,255,.055);color:#91aeb2;font-size:8px;line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.actions button{width:100%}.file{display:none}.entity-list{display:grid;gap:4px;max-height:145px;overflow:auto}.entity-row{display:flex;justify-content:space-between;align-items:center;padding:6px;border-radius:7px;background:rgba(255,255,255,.035);font-size:8px}.entity-row button{height:24px;padding:0 7px}.skill{color:#d8f7c5}
#thought{position:fixed;z-index:6;right:16px;top:38%;width:calc(32% - 32px);padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:rgba(7,17,10,.87);font-size:10px;pointer-events:none}#thought b{display:block;margin-bottom:4px;color:#e4fad4}#thoughtReason{color:#869e80;font-size:8px}#toast{position:fixed;z-index:12;left:34%;top:94px;transform:translateX(-50%) translateY(-7px);padding:8px 14px;border-radius:99px;background:#e4f8b9;color:#1a2612;font-size:10px;font-weight:700;opacity:0;transition:.15s;pointer-events:none}#toast.show{opacity:1;transform:translateX(-50%)}#status{position:fixed;z-index:8;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:20px;padding:0 17px;border-top:1px solid var(--line);background:rgba(6,15,8,.96);color:#aac2a2;font-size:10px}#status b{color:#eff9ea}.dot{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:#8fd25c;box-shadow:0 0 8px #8fd25c}#statusMessage{margin-left:auto;color:#81997b}@media(max-width:1100px){.brand{min-width:140px}.brand small{display:none}.toolbar button,.toolbar .select{padding:0 5px;font-size:8px}.group{padding-left:4px}#drawer{width:350px}}
</style></head><body>
<div class="toolbar"><div class="brand"><b>🌍 果蝇开放生态空间</b><small>同一世界工程 · 生态、训练、部署完全互通</small></div><div class="group"><select id="presetSelect" class="select wide"></select><button id="loadPreset">载入地图</button><button id="editorBtn">🧊 编辑世界</button></div><div class="group"><select id="followFly" class="select wide"></select><button id="addFly">＋ 果蝇</button><button id="pauseBtn">⏸ 暂停</button></div><div class="group spacer"><button id="quickChooseModel">📦 选择模型部署</button><button id="deleteSelected" class="danger">删除选中物</button><button id="openTraining">🧬 训练工作室</button></div></div>
<div id="worldLabel" class="view-label">🌿 大型三维生态全景</div><div id="eyeLabel" class="view-label">👁 当前果蝇第一视角</div><div id="divider"></div><div id="thought"><b>🧠 行为解释</b><span id="thoughtText">正在感知开放世界。</span><div id="thoughtReason">依据：环境刺激与当前策略</div></div><div id="toast"></div>
<section id="drawer"><button id="closeDrawer">×</button><h2>🧊 开放世界编辑器</h2><p>预设只生成起点。所有土块、食物、天敌、出生点和目标均可放置、选择、修改或删除。</p><div class="grid3"><div class="field"><label>X</label><input id="sizeX" type="number" min="6" max="48"></div><div class="field"><label>Y</label><input id="sizeY" type="number" min="6" max="48"></div><div class="field"><label>Z</label><input id="sizeZ" type="number" min="3" max="20"></div></div><button id="applySize">应用尺寸</button><div class="grid2"><div class="field"><label>编辑高度层 Z = <b id="layerValue">1</b></label><input id="editLayer" type="range" min="0" max="9" value="1"></div><div class="field"><label>编辑状态</label><button id="editToggle">开始放置素材</button></div></div><h3>素材库</h3><div id="palette" class="palette"></div><div class="field"><label>新放置天敌等级</label><select id="predatorLevel"><option value="low">低级</option><option value="medium" selected>中级</option><option value="high">高级</option></select></div><div class="info" id="predatorInfo"></div><h3>当前世界对象</h3><div id="entityList" class="entity-list"></div><h3>世界工程与模型部署</h3><div class="actions"><button id="saveWorld">保存世界</button><button id="exportWorld">导出世界</button><button id="importWorld">导入世界/训练包</button><button id="chooseModel">选择训练模型</button></div><input id="worldFile" class="file" type="file" accept="application/json,.json"><input id="modelFile" class="file" type="file" accept="application/json,.json"><div class="field"><label>部署到果蝇</label><select id="deployFly"></select></div><button id="deployModel" disabled>部署模型到指定果蝇</button><div class="info" id="modelStatus">尚未选择开放式强化学习训练包。</div></section>
<section id="brainPanel"><canvas id="brainCanvas"></canvas><div class="brain-head"><b>🧠 <span id="brainFlyName">果蝇</span>实时大脑</b><span id="brainSync">正在连接 FlyWire…</span></div><div id="brainRates"><div><span>全脑 Hz</span><b id="ratePop">0.0</b></div><div><span>逼近视觉</span><b id="rateLoom">0.0</b></div><div><span>前进 DNp09</span><b id="rateForward">0.0</b></div><div><span>逃生翼</span><b id="rateEscape">0.0</b></div></div></section>
<div id="status"><span><i class="dot"></i><b id="runState">运行中</b></span><span>果蝇 <b id="flyCount">0</b></span><span>天敌 <b id="predatorCount">0</b></span><span>食物 <b id="foodCount">0</b></span><span>捕获 <b id="killCount">0</b></span><span id="statusMessage">左侧全景 · 右上第一视角 · 右下同一只果蝇实时大脑</span></div>
<script type="module" src="./ecosystem.js"></script></body></html>
